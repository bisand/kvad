# kvad-serve's bootstrap configuration.
#
# Copy to $XDG_CONFIG_HOME/kvad/kvad.toml (or ~/.config/kvad/kvad.toml), or
# point at it with `kvad-serve --config PATH`. Every key has a default, and a
# missing file is not an error — with no file at all the server binds loopback
# with no authentication, which is the right answer on a laptop.
#
# Only what has to be known before the server starts belongs here. Settings
# that can be changed while it runs live in the database and are edited from
# the UI.

[server]
# Loopback by default. Binding anything else with auth.mode = "none" is
# refused: everyone who could reach the address would be an administrator.
bind = "127.0.0.1:5823"

# Load the active model as soon as the server is listening, rather than
# waiting for the first request to pay for it — tens of seconds, or ninety
# for DeepSeek-V2-Lite. A service that comes back after a reboot comes back
# ready, and the load is a job on the queue like any other, so a request that
# arrives meanwhile waits for it instead of starting a second one.
#
# Off by default: the model would be in memory a minute after boot whether
# or not anybody turns up. Left off, the first request that names a model
# loads it (see load_on_request).
# autoload = false

[data]
# Where the database, generated images, datasets and trained models go.
# Defaults to $XDG_DATA_HOME/kvad, or ~/.local/share/kvad. `~/` is your home
# directory, and a relative path is taken from this file's directory. The
# CLI reads this too, so `kvad` and `kvad-serve` agree; KVAD_DATA_DIR in the
# environment overrides it for one process. `install.sh --data-dir DIR`
# writes it. Changing it here moves nothing: move the old directory
# yourself, with the server stopped. The Settings page's Data section moves
# the data for you, writes this, and restarts the server into it.
#
# Setting it also moves models pulled from Hugging Face, to huggingface/hub
# inside it: the layout of ~/.cache/huggingface/hub, where they go when this
# is not set, so an existing cache moves with one `mv`. HF_HUB_CACHE or
# HF_HOME, when set, still decide. The Hugging Face token stays where it is.
# dir = "/Volumes/Models/kvad"

[videos]
# The ffmpeg that compresses each video once it is made: H.264 at CRF 19 and
# AAC, as LTX's reference writes them. kvad writes an MP4 itself that
# compresses nothing, about 14 MB a second at 768×512; compressed it is about
# a thirtieth of that, at 44 dB PSNR from the original, in under a second.
# "auto" looks on PATH and then in /opt/homebrew/bin, /usr/local/bin and
# /usr/bin, since a launchd service's PATH has only the system directories.
# "off" keeps the uncompressed file. Anything else is a path to ffmpeg.
# ffmpeg = "auto"

[database]
# Defaults to kvad.db in the data directory above. Data rather than cache: what is in
# it — conversations, training runs, API keys — cannot be downloaded again.
# path = "/var/lib/kvad/kvad.db"

[auth]
# One of:
#
#   none   anyone who can reach the socket is an administrator. Loopback only,
#          which the server enforces before it opens the socket.
#   local  a name and a password, against this server's own accounts, with a
#          session cookie. The first account is made against a one-time token
#          printed to the terminal.
#   basic  the same accounts over HTTP Basic, for scripts and for a reverse
#          proxy that would rather forward a header than a cookie.
#   oidc   an external identity provider; see below.
#
# API keys work alongside every mode with accounts: bearer tokens for /v1 and
# everything else, carrying their owner's role.
mode = "none"

# Only read when mode = "oidc". Authorization code with PKCE.
#
# [auth.oidc]
# issuer = "https://accounts.google.com"
# client_id = "…"
# client_secret = "…"          # omit for a public client
# redirect_url = "https://kvad.example.com/api/auth/oidc/callback"
#
# Who may sign in. At least one of these is required: a provider will happily
# authenticate every account it has, and deciding who may use *this machine*
# is not its job.
# allow_emails = ["ada@example.com"]
# allow_domains = ["example.com"]
#
# Who is an administrator. Recomputed at every sign-in, so this file — not the
# Settings page — is the source of truth while this mode is in force.
# admin_emails = ["ada@example.com"]
# role_claim = "groups"        # a claim in the ID token holding group names
# admin_roles = ["kvad-admins"]

[client]
# Where `kvad` sends its commands. Read by the command line, not the server:
# with this set, `kvad chat` on this machine talks to that server instead of
# looking for one here. KVAD_URL and --remote say the same for one shell or
# one command, and --local runs a command in the process whatever is set.
#
# Unset, the CLI looks for this machine's service where it listens — the
# address its unit file gives it, else [server] bind above, else
# 127.0.0.1:5823 — and runs the command itself when nothing answers there.
# url = "http://gpu-box.local:5823"
