[package]
name = "kvad-serve"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP server and web UI for kvad: manage models, chat, train and watch."

[[bin]]
name = "kvad-serve"
path = "src/main.rs"

# The GPU backend is a feature rather than a hard dependency, because it
# pulls candle and metal into a build that is otherwise a web server. On by
# default: this workspace already needs macOS to build `kvad-gpu` at all, so a
# default that assumed otherwise would be pretending. A server that should not
# carry it is built with `--no-default-features`.
[features]
default = ["gpu"]
gpu = ["dep:kvad-gpu"]

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
getrandom = "0.4.3"
kvad = { path = "../llm" }
kvad-gpu = { path = "../gpu", optional = true }
libc = "0.2.189"
mime_guess = "2.0.5"
nanograd = { version = "0.1.0", path = "../nanograd" }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tokio-stream = "0.1.19"
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
