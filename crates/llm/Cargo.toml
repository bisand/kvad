[package]
name = "kvad"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transformer inference from scratch: GPT-2 and Llama-family models, no ML framework."

[features]
# Architectures are modules, and each one is optional: a build with a feature
# off does not contain that code, and `kvad arch` prints what this binary has.
# See `src/model/arch.rs` for why these are Cargo features and not dylibs.
default = ["arch-gpt2", "arch-llama"]
arch-gpt2 = []
arch-llama = []

[dependencies]
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking", "rustls-tls"] }
memmap2 = "0.9.11"
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "serde"] }
nanograd = { version = "0.1.0", path = "../nanograd" }
rayon = "1.10.0"
safetensors = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
