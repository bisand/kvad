# XcodeGen's description of the app: `xcodegen` here makes Kvad.xcodeproj,
# which is not committed. The app is SwiftUI (Kvad/), over the Rust core
# (../core), which build.sh builds as a static library before the Swift is
# compiled. docs/phone-swiftui-plan.md.
name: Kvad
options:
  bundleIdPrefix: eu.kvad
  deploymentTarget:
    iOS: "18.0"
settings:
  # The build phase runs cargo, which reads and writes outside the sandbox
  # Xcode gives scripts.
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_VERSION: "6.0"
targets:
  Kvad:
    type: application
    platform: iOS
    sources:
      - path: Kvad
      - path: Assets.xcassets
    # The development team, for an iPhone build: Signing.xcconfig.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: eu.kvad.phone
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      TARGETED_DEVICE_FAMILY: "1"
      # The core's four C functions (../core/kvad_core.h), and the library
      # build.sh links into the target's temporary directory.
      SWIFT_OBJC_BRIDGING_HEADER: Kvad/Kvad-Bridging-Header.h
      LIBRARY_SEARCH_PATHS: $(TARGET_TEMP_DIR)/rust
      OTHER_LDFLAGS: -lkvad_phone_core -framework Security -framework SystemConfiguration -framework Network -lresolv"
    # The Keychain, where the pairings and the device key are kept
    # (src/secrets.rs): without an access group iOS refuses the app its own
    # items. XcodeGen writes the file; it is not committed.
    entitlements:
      path: Kvad.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)eu.kvad.phone
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Kvad
        # kvad:// links open in the app: the Camera's QR scanner shows one
        # from `kvad remote pair` as a button. The app only fills in the
        # Server field with it; pairing waits for Connect. The app's own
        # scanner (Kvad/Scanner.swift) does the same with the code it reads.
        CFBundleURLTypes:
          - CFBundleURLName: eu.kvad.phone
            CFBundleURLSchemes:
              - kvad
        # Animations at the screen's own rate on ProMotion iPhones, not 60.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The scene lifecycle, which iOS 27 requires; SwiftUI's App makes the
        # scene itself.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # App Transport Security stays on: plain HTTP only to the phone's own
        # network, where a Mac on the LAN is, until the tunnel replaces it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Kvad connects to the Kvad server on your Mac over your local network.
        # Speak: the microphone, only while a take is being recorded, and on
        # with the screen off or the app in the background, as a voice memo
        # is (docs/phone-speak-plan.md).
        NSMicrophoneUsageDescription: Kvad records what you say so that the Kvad server on your Mac can write it out. The recording goes to your Mac and nowhere else.
        UIBackgroundModes:
          - audio
        # The scanner: the camera, only while it is open, asked for at the
        # first Scan a pairing code.
        NSCameraUsageDescription: Kvad uses the camera only to read the pairing code that kvad remote pair shows on your Mac. Nothing the camera sees is recorded or sent.
    preBuildScripts:
      - name: Build the Rust core with cargo
        script: ./build.sh
        basedOnDependencyAnalysis: false
  # Every event in ../messages.json decodes, as the core's tests check every
  # event the core sends is in it.
  KvadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KvadTests
      - path: ../messages.json
        buildPhase: resources
    dependencies:
      - target: Kvad
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kvad.app/Kvad
      BUNDLE_LOADER: $(TEST_HOST)
      PRODUCT_BUNDLE_IDENTIFIER: eu.kvad.phone.tests
schemes:
  Kvad:
    build:
      targets:
        Kvad: all
        KvadTests: [test]
    test:
      targets:
        - KvadTests
