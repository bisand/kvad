# Builds and uploads the binaries for a GitHub release.
#
# The release is the trigger and the source of truth. Draft a release in the
# GitHub UI (or `gh release create v0.2.0`), publish it, and this workflow
# builds a tarball per target in `build`'s matrix from its tag, stamps that
# tag into the crate versions, and attaches the tarballs and a SHA256SUMS to
# that same release. Nothing here creates a release, so the version is
# decided in one place by a person.
#
# Between publishing and the last upload there is a window where the release
# exists with no assets, and `install.sh` will say it cannot find a build for
# this machine. That is the cost of letting the release be the trigger.
# Re-run against an existing release with `workflow_dispatch`.
#
# Why the shape is this:
#
# * The version is rewritten into `[workspace.package]` from the tag, and —
#   once the release has its files — committed back to master, so the branch
#   says what the last release was. One line to rewrite, because every crate
#   that ships in a tarball inherits it with `version.workspace = true`.
#   `nervus` does not — it is published to crates.io on its own cadence and
#   sets its own version, so nothing here stamps it.
#
#   The builds still come from the tag, not from that commit. A release is a
#   statement about the code at a tag, and master may have moved on since it
#   was published; taking the tag's tree and stamping the version into it
#   keeps the artifacts faithful to the release they are attached to.
#
#   The commit is last on purpose. A build that fails should not leave master
#   claiming a version that has no binaries behind it.
# * `cargo update --workspace` after the rewrite, because changing a workspace
#   member's version makes `Cargo.lock` stale and `--locked` would refuse to
#   build. `--workspace` touches only those members; third-party dependencies
#   stay pinned exactly where the committed lock file put them.
# * The web UI is built once, not once per target. `rust-embed` reads
#   `web/dist` at compile time (see crates/serve/src/assets.rs), so every
#   target needs those files present — but they are the same files, and
#   building them once per target would be a chance to ship a different UI
#   with each.
# * macOS also gets Kvad.app (scripts/kvad-app.sh), a copy of kvad-serve in
#   a bundle, which the service runs so Login Items lists it as Kvad.
# * Linux gets `kvad` and `kvad-serve` only. `kvad-tui` and `kvad-gpu` both
#   link candle with Metal, which does not exist off macOS, so `kvad-serve`
#   there is built `--no-default-features`.
# * `--no-default-features` is given to `-p kvad-serve` alone. Applied to the
#   whole workspace it would also switch off `kvad`'s `arch-*` features, and
#   the result would be an engine that can run no architectures at all.
# * The Mac binaries are signed with a Developer ID and notarized, and the
#   job fails without the secrets for it (see `release`, below). The
#   installer's curl download is never quarantined and would run unsigned,
#   but a tarball fetched with a browser is, and a managed Mac may refuse
#   any binary its IT cannot allowlist by Team ID — which the linker's
#   ad-hoc signature does not have.
#
#   The `release` environment holds five secrets: MACOS_CERT_P12, the
#   Developer ID Application certificate and its key exported as a .p12
#   and base64-encoded; MACOS_CERT_PASSWORD, that export's password, left
#   unset if it has none; and
#   NOTARY_KEY_P8 (base64 again), NOTARY_KEY_ID and NOTARY_ISSUER_ID, an
#   App Store Connect API key with the Developer role.
# * Nothing is stripped. The symbol names are what make a panic's backtrace
#   readable in a bug report.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------
  # The tag, checked once, so three jobs agree on what is being built.
  version:
    name: version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          set -eu
          tag="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          # A tag that is not a version would produce a tarball nobody can
          # name and a Cargo.toml that does not parse. Stop here instead.
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "building $tag (crate version ${tag#v})"

  # ---------------------------------------------------------------------
  web:
    name: web UI
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      # A missing index.html means kvad-serve would compile happily and serve
      # its "no UI was built into this binary" stub. Better to fail here.
      - name: Check there is a UI
        run: test -s web/dist/index.html

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # ---------------------------------------------------------------------
  build:
    name: ${{ matrix.target }}
    needs: [version, web]
    runs-on: ${{ matrix.os }}
    # Holds the signing and notarization secrets, so they are given to this
    # workflow's builds and to nothing that runs on a pull request.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            packages: -p kvad -p kvad-tui -p kvad-gpu -p kvad-serve
            extra: ""
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            packages: -p kvad
            extra: -p kvad-serve --no-default-features
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            packages: -p kvad
            extra: -p kvad-serve --no-default-features

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Stamp the release version into the workspace
        run: |
          set -eu
          version="${{ needs.version.outputs.version }}"
          # The first `version = "..."` in the root manifest is the workspace
          # one; every crate inherits it. Anchored and count-limited so a
          # dependency's version can never be hit by accident.
          perl -0pi -e 's/^version = "[^"]*"$/version = "'"$version"'"/m' Cargo.toml
          grep -q "^version = \"$version\"$" Cargo.toml || {
            echo "::error::failed to stamp $version into Cargo.toml"; exit 1; }
          cargo update --workspace --quiet
          cargo metadata --format-version 1 --no-deps --offline |
            tr ',' '\n' | grep -E '"(name|version)"' | head -20

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.packages }}
          if [ -n "${{ matrix.extra }}" ]; then
            cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.extra }}
          fi

      # The certificate goes into a keychain of its own, made for this job
      # and deleted at the end of it, so nothing else on the runner can sign
      # with it and nothing is left behind if the runner is not as fresh as
      # it should be. Missing secrets fail the job: a release that quietly
      # shipped unsigned Mac binaries would look fine until it reached a
      # machine that refuses them.
      - name: Sign the Mac binaries
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -eu
          # The password may be empty: Keychain Access exports without one
          # if nothing is typed, and the secret store is what protects the
          # file here anyway.
          [ -n "$MACOS_CERT_P12" ] || {
            echo "::error::MACOS_CERT_P12 is not set"; exit 1; }

          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw=$(openssl rand -hex 24)
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -f pkcs12 \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign stops to ask whether it may use the key,
          # and nobody is there to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$kc_pw" "$kc" >/dev/null
          # codesign finds identities through the search list only. The
          # existing list is split on purpose: one argument per keychain.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -v -p codesigning "$kc" |
            awk '/"Developer ID Application: / { print $2; exit }')
          [ -n "$identity" ] || {
            echo "::error::the certificate is not a Developer ID Application identity"; exit 1; }

          # The hardened runtime is what notarization asks for. kvad needs
          # no entitlements under it: Metal compiles its kernels in a
          # separate process, and nothing here maps executable memory or
          # loads a library it did not link. --timestamp keeps a signature
          # valid after the certificate itself has expired. The identifier
          # is fixed so the firewall, Login Items and an IT allowlist see
          # the same program from one release to the next.
          for bin in kvad kvad-serve kvad-tui kvad-gpu; do
            f="target/${{ matrix.target }}/release/$bin"
            [ -f "$f" ] || continue
            codesign --force --options runtime --timestamp \
              --identifier "eu.kvad.$bin" --keychain "$kc" --sign "$identity" "$f"
            codesign --verify --strict --verbose=2 "$f"
            details=$(codesign -dv "$f" 2>&1)
            echo "$details" | grep -E '^(Identifier|Authority|TeamIdentifier)='
            echo "$details" | grep -q 'flags=.*runtime' || {
              echo "::error::$bin was signed without the hardened runtime"; exit 1; }
          done

          # The bundle the service runs kvad-serve from, so Login Items lists
          # it as Kvad rather than under the developer's name. Signed as a
          # bundle, which seals the Info.plist and the icon with the binary.
          app=$(scripts/kvad-app.sh "target/${{ matrix.target }}/release/kvad-serve" \
            "${{ needs.version.outputs.tag }}" "target/${{ matrix.target }}/release")
          codesign --force --options runtime --timestamp \
            --keychain "$kc" --sign "$identity" "$app"
          codesign --verify --strict --verbose=2 "$app"

      # Apple's answer is waited for here rather than after the upload, so a
      # rejected build never reaches the release. Only Kvad.app gets its ticket
      # stapled: a ticket can be attached to an app, a disk image or a
      # package, not to a bare executable, so Gatekeeper fetches the binaries'
      # from Apple the first time a downloaded one runs.
      - name: Notarize the Mac binaries
        if: runner.os == 'macOS'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -eu
          [ -n "$NOTARY_KEY_P8" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ] || {
            echo "::error::NOTARY_KEY_P8, NOTARY_KEY_ID and NOTARY_ISSUER_ID are not set"; exit 1; }

          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$key"
          auth="--key $key --key-id $NOTARY_KEY_ID --issuer $NOTARY_ISSUER_ID"

          staging="$RUNNER_TEMP/notarize/kvad"
          mkdir -p "$staging"
          for bin in kvad kvad-serve kvad-tui kvad-gpu; do
            f="target/${{ matrix.target }}/release/$bin"
            [ -f "$f" ] && cp "$f" "$staging/"
          done
          ditto "target/${{ matrix.target }}/release/Kvad.app" "$staging/Kvad.app"
          ditto -c -k --keepParent "$staging" "$RUNNER_TEMP/notarize.zip"

          # shellcheck disable=SC2086 # $auth is meant to split into flags
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" $auth \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"; echo
          status=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)
          if [ "$status" != Accepted ]; then
            id=$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json" 2>/dev/null || true)
            # Apple's log says which file and which rule, which the status
            # never does.
            # shellcheck disable=SC2086
            [ -n "$id" ] && xcrun notarytool log "$id" $auth || true
            echo "::error::notarization ended '${status:-without an answer}'"
            exit 1
          fi
          xcrun stapler staple "target/${{ matrix.target }}/release/Kvad.app"

      - name: Package
        id: package
        run: |
          set -eu
          name="kvad-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          out="dist/$name"
          mkdir -p "$out"

          # Whatever this target produced, rather than a list per platform:
          # the matrix already decided, and repeating it here is a second
          # place for the two to disagree.
          for bin in kvad kvad-serve kvad-tui kvad-gpu; do
            if [ -f "target/${{ matrix.target }}/release/$bin" ]; then
              cp "target/${{ matrix.target }}/release/$bin" "$out/$bin"
              chmod 755 "$out/$bin"
            fi
          done
          test -f "$out/kvad" || { echo "::error::no kvad binary was built"; exit 1; }
          app="target/${{ matrix.target }}/release/Kvad.app"
          [ ! -d "$app" ] || ditto "$app" "$out/Kvad.app"

          cp LICENSE README.md "$out/"
          cp docs/kvad.example.toml "$out/"

          tar -czf "dist/$name.tar.gz" -C dist "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la "dist/$name.tar.gz"

      # Runs the binary it just built, on the machine that built it, and
      # checks it agrees with the release about what it is. Every target is
      # native to its runner, so every target gets run.
      - name: Smoke test
        run: |
          set -eu
          expected="kvad ${{ needs.version.outputs.version }}"
          got=$(./dist/${{ steps.package.outputs.name }}/kvad --version)
          [ "$got" = "$expected" ] || {
            echo "::error::built binary reports '$got', expected '$expected'"; exit 1; }
          ./dist/${{ steps.package.outputs.name }}/kvad-serve --version

      # The case the signing is for: a binary downloaded with a browser,
      # which marks it quarantined, so Gatekeeper checks it before it runs.
      # The flag is set by hand here the way Safari would set it. Under a
      # time limit, because a binary Gatekeeper dislikes may be held for a
      # dialog nobody on a runner will ever see.
      - name: Gatekeeper accepts a downloaded binary
        if: runner.os == 'macOS'
        run: |
          set -eu
          dir="$RUNNER_TEMP/downloaded"
          mkdir -p "$dir"
          cp "dist/${{ steps.package.outputs.name }}/kvad-serve" "$dir/"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;$(uuidgen)" "$dir/kvad-serve"
          xattr -p com.apple.quarantine "$dir/kvad-serve"
          perl -e 'alarm shift; exec @ARGV' 120 "$dir/kvad-serve" --version || {
            echo "::error::Gatekeeper would not run a quarantined kvad-serve"; exit 1; }

      - name: Remove the signing keychain and keys
        if: always() && runner.os == 'macOS'
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$kc" ]; then security delete-keychain "$kc"; fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*.tar.gz
          retention-days: 7

  # ---------------------------------------------------------------------
  upload:
    name: attach to the release
    needs: [version, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # One file, sorted, so `grep " $name.tar.gz$"` in install.sh has
      # exactly one line to find.
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum -- *.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # --clobber so a re-run replaces assets instead of failing on them.
          gh release upload "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" --clobber \
            artifacts/*.tar.gz artifacts/SHA256SUMS

      # Appended, not written: the notes are the maintainer's. The marker
      # makes a re-run leave them alone rather than stack a second copy.
      - name: Add install instructions to the notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${{ needs.version.outputs.tag }}"
          repo="${{ github.repository }}"
          notes=$(gh release view "$tag" --repo "$repo" --json body --jq .body)
          case "$notes" in *"<!-- install -->"*) echo "already there"; exit 0 ;; esac
          gh release edit "$tag" --repo "$repo" --notes "$notes

          <!-- install -->
          ## Install

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/$repo/master/install.sh | sh
          \`\`\`

          It asks before putting anything on your PATH or starting anything at
          login, and if the server should start at login it asks what address to
          listen on, offering \`127.0.0.1:5823\`. Name one it cannot serve from — an
          address something already holds, or a non-loopback one, which
          \`kvad-serve\` refuses while no auth mode is configured — and it says why
          and asks again, rather than installing a service that cannot start.

          For a machine with nobody watching, \`--yes\` never opens a terminal and
          answers every question the quiet way: binaries only, nothing added to
          your shell and nothing started. Ask for the rest explicitly, \`--bind\`
          included, since a run that cannot stop to ask would otherwise take 5823:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/$repo/master/install.sh | sh -s -- --yes --service --bind 127.0.0.1:8123
          \`\`\`

          \`--prefix DIR\`, \`--version vX.Y.Z\` and \`--uninstall\` do what they look
          like; \`--uninstall\` takes the binaries and the service and leaves your
          models and conversations alone. \`sh install.sh --help\` lists the rest.

          macOS ships \`kvad\`, \`kvad-serve\`, \`kvad-tui\` and \`kvad-gpu\`, and
          \`Kvad.app\`, which the background service runs \`kvad-serve\` from. Linux
          ships \`kvad\` and a CPU-only \`kvad-serve\`; the other two link Metal.

          Downloads can be checked against \`SHA256SUMS\` below."

  # ---------------------------------------------------------------------
  bump:
    name: commit the version to master
    needs: [version, upload]
    runs-on: ubuntu-22.04
    # `actions: write` is for the last step, which starts another workflow.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          # The default token, with the workflow's contents: write, is what
          # pushes this back. checkout keeps the credentials for it.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set the workspace version and push it
        run: |
          set -eu
          version="${{ needs.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Master can move while a release builds — this workflow takes over
          # ten minutes — so each attempt starts from whatever master is now
          # and applies the version to that. Rebasing a commit that edits
          # Cargo.toml onto a master that also edited it conflicts, and a
          # conflict in an unattended job is a job that hangs on a prompt or
          # dies half-rebased. Re-applying cannot conflict: there is only
          # ever one commit, and it is always on top.
          for attempt in 1 2 3; do
            git fetch --quiet origin master
            git reset --quiet --hard origin/master

            perl -0pi -e 's/^version = "[^"]*"$/version = "'"$version"'"/m' Cargo.toml
            grep -q "^version = \"$version\"$" Cargo.toml || {
              echo "::error::failed to set $version in Cargo.toml"; exit 1; }
            cargo update --workspace --quiet

            # A re-run against a release whose version master already carries
            # has nothing to say, and an empty commit would be noise.
            if git diff --quiet; then
              echo "master is already at $version"
              exit 0
            fi

            git add Cargo.toml Cargo.lock
            git commit --quiet -m "Set the workspace version to $version

          Written by the release workflow from the tag of the GitHub release
          this was built for, so master says what the last release was."

            if git push origin HEAD:master; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "master moved while this ran; taking it again"
          done
          echo "::error::could not push the version to master after 3 attempts"
          exit 1

      # kvad.eu's front page says the version, read from Cargo.toml when the
      # site is built, and site.yml lists Cargo.toml among what it deploys
      # for. But a push made with the workflow's own token starts no
      # workflow, which is GitHub's guard against one triggering itself for
      # ever, so the commit above never deployed anything: the front page
      # said the release before, until something else touched the site.
      # Starting a workflow by hand is the exception to that rule.
      - name: Deploy kvad.eu, which says the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref master --repo "${{ github.repository }}"
