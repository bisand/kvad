[workspace]
resolver = "2"
members = ["crates/nervus", "crates/llm", "crates/tui", "crates/gpu", "crates/serve"]

[workspace.package]
# What every crate here ships as, bar one. They inherit it with
# `version.workspace = true`, and the release workflow rewrites this line
# from the tag of the GitHub release being published — so what a binary
# reports for `--version` is what the release says it is, and there is no
# second copy to forget.
#
# The exception is `nervus`, which is published to crates.io by itself and
# carries its own version for its own reasons; see its manifest.
version = "0.10.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

# Release-ish profile for `cargo run` too. Numerical code is 20-50x slower
# in debug builds, which makes "is my backprop wrong?" impossible to tell
# apart from "is my machine slow?".
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# What `.github/workflows/check.yml` builds and tests with: release's
# optimisation, so the numerical tests run at release speed, without what
# only a shipped binary needs. Thin LTO and one codegen unit made the check's
# 19 test binaries take 11 minutes to link on a hosted runner, for tests that
# then ran in 65 seconds. Without them, rebuilding the workspace's crates for
# the tests took 44 s where it had taken 4 min 33 s, on 4 cores of an M5.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
debug = false
incremental = false
