# kvad-serve's bootstrap configuration.
#
# Copy to $XDG_CONFIG_HOME/kvad/kvad.toml (or ~/.config/kvad/kvad.toml), or
# point at it with `kvad-serve --config PATH`. Every key has a default, and a
# missing file is not an error — with no file at all the server binds loopback
# with no authentication, which is the right answer on a laptop.
#
# Only what has to be known before the server starts belongs here. Settings
# that can be changed while it runs live in the database and are edited from
# the UI.

[server]
# Loopback by default. Binding anything else with auth.mode = "none" is
# refused: everyone who could reach the address would be an administrator.
bind = "127.0.0.1:8080"

# Load the active model as soon as the server is listening, rather than
# waiting for the first request to pay for it — tens of seconds, or ninety
# for DeepSeek-V2-Lite. A service that comes back after a reboot comes back
# ready, and the load is a job on the queue like any other, so a request that
# arrives meanwhile waits for it instead of starting a second one.
#
# The cost is honest rather than hidden: the model is in memory a minute
# after boot whether or not anybody turns up. Set false to spend that memory
# only when something asks.
# autoload = true

[database]
# Defaults to $XDG_DATA_HOME/kvad/kvad.db. Data rather than cache: what is in
# it — conversations, training runs, API keys — cannot be downloaded again.
# path = "/var/lib/kvad/kvad.db"

[auth]
# One of:
#
#   none   anyone who can reach the socket is an administrator. Loopback only,
#          which the server enforces before it opens the socket.
#   local  a name and a password, against this server's own accounts, with a
#          session cookie. The first account is made against a one-time token
#          printed to the terminal.
#   basic  the same accounts over HTTP Basic, for scripts and for a reverse
#          proxy that would rather forward a header than a cookie.
#   oidc   an external identity provider; see below.
#
# API keys work alongside every mode with accounts: bearer tokens for /v1 and
# everything else, carrying their owner's role.
mode = "none"

# Only read when mode = "oidc". Authorization code with PKCE.
#
# [auth.oidc]
# issuer = "https://accounts.google.com"
# client_id = "…"
# client_secret = "…"          # omit for a public client
# redirect_url = "https://kvad.example.com/api/auth/oidc/callback"
#
# Who may sign in. At least one of these is required: a provider will happily
# authenticate every account it has, and deciding who may use *this machine*
# is not its job.
# allow_emails = ["ada@example.com"]
# allow_domains = ["example.com"]
#
# Who is an administrator. Recomputed at every sign-in, so this file — not the
# Settings page — is the source of truth while this mode is in force.
# admin_emails = ["ada@example.com"]
# role_claim = "groups"        # a claim in the ID token holding group names
# admin_roles = ["kvad-admins"]
