[package]
name = "kvad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transformer inference from scratch: GPT-2, Llama-family and DeepSeek models, no ML framework."

[features]
# Architectures are modules, and each one is optional: a build with a feature
# off does not contain that code, and `kvad arch` prints what this binary has.
# See `src/model/arch.rs` for why these are Cargo features and not dylibs.
default = ["arch-gpt2", "arch-llama", "arch-deepseek", "arch-qwen3-5", "cluster"]
arch-gpt2 = []
arch-llama = []
arch-deepseek = []
arch-qwen3-5 = []
# One model across several machines: `src/cluster/`, and `kvad cluster`.
# See docs/cluster-plan.md.
cluster = []
# A scripted stand-in for a Whisper (`speech::live::script`), for kvad-serve's
# tests of `/v1/realtime`. Tests only; nothing ships with it.
script = []

[dependencies]
# `kvad --remote kvad://…`: a server reached through the tunnel of
# docs/relay-plan.md, from anywhere. Kvad's own crate, which keeps iroh behind it.
kvad-tunnel = { path = "../tunnel" }
# `kvad tunnel`'s listener and copies, on the runtime kvad-tunnel already
# brings into the build; `signal` to close the connection on Ctrl-C.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal"] }
# `kvad remote pair`'s QR code in the terminal; the encoder only, without
# its image and SVG renderers.
qrcode = { version = "0.14.1", default-features = false }
hf-hub = { version = "1.0.0", default-features = false, features = ["blocking", "rustls-tls"] }
# For `F_NOCACHE`: a residency cache that holds its own slabs does not
# want the kernel holding a second copy of the same bytes. Already a direct
# dependency of `kvad-serve` and long since in the tree.
libc = "0.2.189"
memmap2 = "0.9.11"
# `json` is not decoration: every chat template that takes tools writes them
# out with the `tojson` filter, and without the feature the render fails at
# request time with "unknown filter" — on the one code path a plain
# conversation never reaches.
#
# `preserve_order` for the same filter, and it takes both this and
# serde_json's: the schema is parsed by one and rendered by the other, and
# either one's default map sorts the keys before the model sees them.
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "json", "preserve_order", "serde"] }
nervus = { path = "../nervus" }
rayon = "1.10.0"
safetensors = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
# For the cluster key's handshake: HMAC is written out in `cluster/key.rs`
# and this is the hash under it. Already in the tree, by way of `hf-hub`.
sha2 = "0.11"
# `preserve_order` because a tool schema reaches the model as text. Every
# chat template dumps the schemas the client sent with `tojson`, and a `Value`
# backed by a BTreeMap sorts the keys on the way: OpenAI's
# `{"type": …, "function": {"name", "description", "parameters"}}` came out as
# `{"function": {"description", "name", "parameters"}, "type": …}`. The
# information is the same and the prompt is not, and the prompt is what the
# model was tuned on. See minijinja above: it takes the feature on both.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# For `kvad.toml`, which the CLI reads to find the server it is a client of:
# `[client] url`, and `server.bind` for where this machine's service listens.
# Already in the tree for `kvad-serve`, which reads the same file.
toml = "1.1.6"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
# Resolving `../ch01.html` against the page that linked it, for `crawl`: fiddly
# and security-relevant arithmetic, and the one place a crate earns its keep.
url = "2.5.8"

[[example]]
name = "split"
required-features = ["cluster"]

[[example]]
name = "hops"
required-features = ["cluster"]
