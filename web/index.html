<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kvad</title>
    <!-- From `public/`, which Vite copies to the root of `dist` as it is.
         The sources and the larger sizes are in docs/brand. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Before first paint, or the page flashes light and then goes dark.
      // Nothing is set when the choice is "system": daisyUI's `--prefersdark`
      // already follows the OS, and an explicit attribute would override it.
      try {
        const theme = localStorage.getItem("kvad.theme");
        if (theme === "light" || theme === "dim")
          document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
