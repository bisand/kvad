# XcodeGen's description of the app: `xcodegen` here makes Kvad.xcodeproj,
# which is not committed. The Rust is built by build.sh, which Xcode runs.
name: Kvad
options:
  bundleIdPrefix: eu.kvad
  deploymentTarget:
    iOS: "17.0"
settings:
  # The build phase runs cargo, which reads and writes outside the sandbox
  # Xcode gives scripts.
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  Kvad:
    type: application
    platform: iOS
    sources:
      - path: Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: eu.kvad.phone
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Kvad
        # Animations at the screen's own rate on ProMotion iPhones, not 60.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen:
          UIColorName: ""
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The scene lifecycle, which iOS 27 requires; the delegate is
        # Slint's winit backend's.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Slint
                UISceneDelegateClassName: SlintWindowSceneDelegate
        # App Transport Security stays on: plain HTTP only to the phone's own
        # network, where a Mac on the LAN is, until the tunnel replaces it.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Kvad connects to the Kvad server on your Mac over your local network.
    postCompileScripts:
      - name: Build the Rust app with cargo
        script: ./build.sh kvad-phone
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
