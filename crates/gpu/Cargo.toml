[package]
name = "llm-gpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The same transformer, on the GPU via candle."

[lib]
name = "llm_gpu"
path = "src/lib.rs"

[[bin]]
name = "llm-gpu"
path = "src/main.rs"

[dependencies]
candle-core = { version = "0.11.0", features = ["metal"] }
candle-nn = { version = "0.11.0", features = ["metal"] }
llm = { path = "../llm" }
