[package]
name = "kvad-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The same transformer, on the GPU via candle."

[lib]
name = "kvad_gpu"
path = "src/lib.rs"

[[bin]]
name = "kvad-gpu"
path = "src/main.rs"

[dependencies]
candle-core = { version = "0.11.0", features = ["metal"] }
candle-nn = { version = "0.11.0", features = ["metal"] }
kvad = { path = "../llm" }
# The image pipelines tokenise their own prompts: CLIP's vocabulary is not a
# language model's, and there is no `Llm` around it to do it for them. The
# same crate and version `kvad` already builds.
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }

# `src/mpp.rs` compiles a Metal 4 kernel of its own and dispatches it on
# candle's device, and so does `examples/neural_accel.rs`. candle keeps these
# types to itself; the versions are the ones it already pulls in, so nothing
# new is built.
[target.'cfg(target_os = "macos")'.dependencies]
candle-metal-kernels = "0.11.0"
objc2-metal = "0.3.2"
# `F_NOCACHE`, for reading an image model's checkpoints past the page cache
# (`image::open`). The version `kvad` already builds.
libc = "0.2.189"
